<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1200 260" width="1200" height="260" role="img" aria-label="FeliVet Insight - Spot cat skin issues early" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1e9ff"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c4dff"/><stop offset="100%" stop-color="#c4a8ff"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <style>
    text { font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title { font-size: 64px; }
    .bold { font-weight: 700; fill: #f4f0ff; }
    .light { font-weight: 300; fill: #c9b8ff; }
    .tag { font-size: 20px; fill: #9d8fc0; letter-spacing: 4px; }
    .fade { opacity: 0; animation: fadeUp 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .breathe { animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
  </style>

  <rect width="1200" height="300" fill="#161616"/>
  <ellipse class="breathe" cx="380" cy="150" rx="420" ry="200" fill="url(#glow)"/>

  <g transform="translate(360 150)">
    <g class="float" filter="url(#drop)">
      <line x1="42" y1="42" x2="84" y2="84" stroke="#6d3fd1" stroke-width="14" stroke-linecap="round"/>
      <circle r="60" fill="#1f1736"/>
      <circle r="60" fill="none" stroke="#e3d6ff" stroke-opacity=".3" stroke-width="8"/>
      <g>
        <circle r="60" fill="none" stroke="url(#arc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="100 277"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
      </g>
      <g class="pulse" fill="url(#paw)" transform="translate(0 -4)">
        <path d="M0,0 C-14,0 -24,12 -22,22 C-20,30 -10,28 0,28 C10,28 20,30 22,22 C24,12 14,0 0,0Z"/>
        <circle cx="-27" cy="-2" r="8"/><circle cx="-10" cy="-16" r="8"/>
        <circle cx="10" cy="-16" r="8"/><circle cx="27" cy="-2" r="8"/>
      </g>
    </g>
  </g>

  <g class="fade d1"><text class="title" x="470" y="156"><tspan class="bold">FeliVet</tspan><tspan class="light" dx="14">Insight</tspan></text></g>
  <g class="fade d2"><text class="tag" x="474" y="198">SPOT CAT SKIN ISSUES EARLY</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
