<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 250" width="846" height="250">
  <defs>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="846" height="250" fill="#000"/>

  <!-- Ambient purple glow behind paw -->
  <circle cx="675" cy="125" r="105" fill="url(#ambientGlow)">
    <animate attributeName="r" values="98;112;98" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.37 0 0.63 1;0.37 0 0.63 1"/>
  </circle>

  <!-- Title & subtitle (CachyOS-style crisp typography) -->
  <text x="68" y="128" font-family="Inter,'SF Pro Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="38" font-weight="500" letter-spacing="-0.8" fill="#ffffff">FeliVet <tspan fill="#c4b5fd">Insight</tspan></text>
  <text x="70" y="156" font-family="Inter,'SF Pro Display','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" letter-spacing="0.2" fill="#9ca3af">On-device feline skin screening · YOLOv8 + clinical triage</text>

  <!-- Right-side animated paw emblem matching assets/icon/icon.png -->
  <g transform="translate(675 125)">
    <g>
      <!-- Subtle pulse ring -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.35">
        <animate attributeName="r" values="52;68;52" dur="4.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.37 0 0.63 1;0.37 0 0.63 1"/>
        <animate attributeName="opacity" values="0.4;0.08;0.4" dur="4.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.37 0 0.63 1;0.37 0 0.63 1"/>
      </circle>

      <!-- Rounded app icon tile -->
      <rect x="-48" y="-48" width="96" height="96" rx="24" fill="url(#pawGrad)" filter="url(#softGlow)"/>
      <rect x="-48" y="-48" width="96" height="96" rx="24" fill="none" stroke="#ddd6fe" stroke-opacity="0.25" stroke-width="1"/>

      <!-- Cat paw silhouette -->
      <g fill="#ffffff">
        <ellipse cx="0" cy="14" rx="20" ry="15"/>
        <circle cx="-24" cy="-7" r="7.5"/>
        <circle cx="-9" cy="-19" r="8"/>
        <circle cx="9" cy="-19" r="8"/>
        <circle cx="24" cy="-7" r="7.5"/>
      </g>

      <animateTransform attributeName="transform" type="translate" values="0 -4;0 4;0 -4" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.37 0 0.63 1;0.37 0 0.63 1"/>
    </g>
  </g>
</svg>
